name: Concurrent Multi-Timeframe Scan

on:
  # Scheduled run - runs BOTH daily and weekly concurrently
  schedule:
    - cron: '30 22 * * 1-5'  # Mon-Fri at 10:30 PM UTC (5:30 PM EST / 6:30 PM EDT) - scans both 1d and 1wk timeframes

  # Manual trigger with multiple timeframe selection
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (comma-separated: 1d,1wk,1mo)'
        required: true
        default: '1d,1wk'
        type: string
      tp_strategy:
        description: 'Take Profit Strategy'
        required: true
        default: 'MITCH'
        type: choice
        options:
          - 'SCOTT'
          - 'MITCH'
          - 'POSITION'
      include_crypto:
        description: 'Include crypto scan?'
        required: true
        default: false
        type: boolean
      max_stocks:
        description: 'Max stocks per timeframe (empty = all)'
        required: false
        type: string

jobs:
  # Parse the timeframes input into a matrix
  setup:
    runs-on: ubuntu-latest
    outputs:
      timeframes: ${{ steps.parse.outputs.timeframes }}
      tp_strategy: ${{ steps.parse.outputs.tp_strategy }}
      include_crypto: ${{ steps.parse.outputs.include_crypto }}
      max_stocks: ${{ steps.parse.outputs.max_stocks }}
    steps:
      - name: Parse timeframes
        id: parse
        run: |
          # Determine configuration based on trigger type
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Scheduled run - run BOTH daily and weekly timeframes concurrently
            echo "timeframes=[\"1d\",\"1wk\"]" >> $GITHUB_OUTPUT
            echo "tp_strategy=MITCH" >> $GITHUB_OUTPUT
            echo "include_crypto=false" >> $GITHUB_OUTPUT
            echo "max_stocks=" >> $GITHUB_OUTPUT
            echo "📊 Scheduled: Concurrent Daily (1d) + Weekly (1wk) Scan - 5 min after market close"
          else
            # Manual trigger - use provided inputs
            TIMEFRAMES="${{ github.event.inputs.timeframes }}"
            JSON_ARRAY=$(echo $TIMEFRAMES | jq -R -c 'split(",")')
            echo "timeframes=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "tp_strategy=${{ github.event.inputs.tp_strategy }}" >> $GITHUB_OUTPUT
            echo "include_crypto=${{ github.event.inputs.include_crypto }}" >> $GITHUB_OUTPUT
            echo "max_stocks=${{ github.event.inputs.max_stocks }}" >> $GITHUB_OUTPUT
            echo "🎯 Manual: Timeframes=$TIMEFRAMES, Strategy=${{ github.event.inputs.tp_strategy }}, Crypto=${{ github.event.inputs.include_crypto }}"
          fi

  # Run stock scans sequentially for each timeframe (to avoid rate limits)
  stock-scans:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 240  # Increased for sequential runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scans sequentially
        env:
          PYTHONUNBUFFERED: "1"
          TIMEFRAMES: ${{ needs.setup.outputs.timeframes }}
          TP_STRATEGY: ${{ needs.setup.outputs.tp_strategy }}
          MAX_STOCKS: ${{ needs.setup.outputs.max_stocks }}
        run: |
          # Parse timeframes JSON array
          TIMEFRAMES_ARRAY=$(echo $TIMEFRAMES | jq -r '.[]')

          echo "========================================================================="
          echo "SEQUENTIAL SCAN - Running timeframes one at a time to avoid rate limits"
          echo "========================================================================="
          echo "Timeframes to scan: $TIMEFRAMES_ARRAY"
          echo ""

          # Loop through each timeframe sequentially
          for TIMEFRAME in $TIMEFRAMES_ARRAY; do
            echo ""
            echo "========================================================================="
            echo "🚀 Starting $TIMEFRAME scan..."
            echo "========================================================================="

            # Configure for this timeframe
            sed -i "s/DATA_INTERVAL = '.*'/DATA_INTERVAL = '$TIMEFRAME'/" src/config/config.py
            sed -i "s/TP_STRATEGY = '.*'/TP_STRATEGY = '$TP_STRATEGY'/" src/config/config.py

            # Only override MAX_STOCKS_TO_SCAN if explicitly provided
            if [ -n "$MAX_STOCKS" ]; then
              sed -i "s/MAX_STOCKS_TO_SCAN = [0-9]*/MAX_STOCKS_TO_SCAN = $MAX_STOCKS/" src/config/config.py
            fi

            echo "⚙️ Configuration:"
            grep "DATA_INTERVAL = " src/config/config.py
            grep "TP_STRATEGY = " src/config/config.py
            grep "MAX_STOCKS_TO_SCAN = " src/config/config.py
            grep "PARALLEL_WORKERS = " src/config/config.py
            grep "DOWNLOAD_DELAY = " src/config/config.py
            echo ""

            # Run the scan
            SCAN_START=$(date +%s)
            python -u src/harmonic_scanner.py
            SCAN_EXIT=$?
            SCAN_END=$(date +%s)
            SCAN_DURATION=$((SCAN_END - SCAN_START))
            SCAN_MINUTES=$((SCAN_DURATION / 60))
            SCAN_SECONDS=$((SCAN_DURATION % 60))

            if [ $SCAN_EXIT -eq 0 ]; then
              echo ""
              echo "✅ $TIMEFRAME scan completed successfully in ${SCAN_MINUTES}m ${SCAN_SECONDS}s"

              # Extract trades
              REPORT_DATE=$(date +%Y-%m-%d)
              if [ -d "reports/$REPORT_DATE" ]; then
                python scripts/extract_trades.py --date $REPORT_DATE --timeframe $TIMEFRAME || true
              fi
            else
              echo ""
              echo "❌ $TIMEFRAME scan failed with exit code $SCAN_EXIT"
              # Continue with next timeframe instead of exiting
            fi

            echo "========================================================================="
            echo ""
          done

          echo ""
          echo "========================================================================="
          echo "✅ ALL SCANS COMPLETE"
          echo "========================================================================="

      - name: Send Discord notifications for all timeframes
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TIMEFRAMES: ${{ needs.setup.outputs.timeframes }}
          TP_STRATEGY: ${{ needs.setup.outputs.tp_strategy }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK not set - skipping Discord notifications"
            exit 0
          fi

          REPORT_DATE=$(date +%Y-%m-%d)
          TIMEFRAMES_ARRAY=$(echo $TIMEFRAMES | jq -r '.[]')

          # Send a Discord notification for each timeframe
          for TIMEFRAME in $TIMEFRAMES_ARRAY; do
            echo "Preparing Discord notification for $TIMEFRAME..."
            REPORT_FILE="reports/$REPORT_DATE/$TIMEFRAME/harmonic_report_${REPORT_DATE}_$TIMEFRAME.txt"

            if [ ! -f "$REPORT_FILE" ]; then
              echo "⚠️ Report file not found for $TIMEFRAME, skipping Discord notification"
              continue
            fi

            # Extract statistics
            TOTAL=$(grep "Total Stocks Scanned:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            BUY=$(grep "BUY Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            SELL=$(grep "SELL Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")

            # Build Discord message title/color
            if [ "$BUY" -gt 0 ] || [ "$SELL" -gt 0 ]; then
              COLOR="3066993"  # Green
              TITLE="✅ $TIMEFRAME Scan Complete - Signals Found!"
            else
              COLOR="10181046"  # Grey
              TITLE="📊 $TIMEFRAME Scan Complete"
            fi

            DESCRIPTION="**Timeframe:** $TIMEFRAME\\n**Strategy:** $TP_STRATEGY\\n**Total Scanned:** $TOTAL\\n\\n🟢 **BUY Signals:** $BUY\\n🔴 **SELL Signals:** $SELL"


            # Run Python script to parse signals and create Discord payload
            REPORT_FILE="$REPORT_FILE" TITLE="$TITLE" DESCRIPTION="$DESCRIPTION" COLOR="$COLOR" TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              python3 .github/scripts/parse_discord_signals.py > "discord_payload_$TIMEFRAME.json"

            # Send Discord notification
            curl -H "Content-Type: application/json" \
                 -d @"discord_payload_$TIMEFRAME.json" \
                 $DISCORD_WEBHOOK

            echo "✅ Discord notification sent for $TIMEFRAME"
          done

      - name: Upload all reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-all-timeframes-${{ github.run_number }}
          path: |
            reports/
            paper_trades.json
          retention-days: 30

  # Crypto scans - also run sequentially now
  crypto-scan:
    needs: setup
    if: needs.setup.outputs.include_crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crypto scans sequentially
        env:
          PYTHONUNBUFFERED: "1"
          TIMEFRAMES: ${{ needs.setup.outputs.timeframes }}
        run: |
          TIMEFRAMES_ARRAY=$(echo $TIMEFRAMES | jq -r '.[]')

          echo "========================================================================="
          echo "SEQUENTIAL CRYPTO SCAN"
          echo "========================================================================="

          for TIMEFRAME in $TIMEFRAMES_ARRAY; do
            echo ""
            echo "🚀 Starting $TIMEFRAME crypto scan..."

            sed -i "s/DATA_INTERVAL = '.*'/DATA_INTERVAL = '$TIMEFRAME'/" src/config/config.py
            python -u scripts/scan_crypto.py

            # Extract trades
            REPORT_DATE=$(date +%Y-%m-%d)
            if [ -d "crypto_reports/$REPORT_DATE" ]; then
              python scripts/extract_crypto_trades.py --date $REPORT_DATE --timeframe $TIMEFRAME || true
            fi
          done

      - name: Send Discord notifications for all crypto timeframes
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TIMEFRAMES: ${{ needs.setup.outputs.timeframes }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK not set - skipping Discord notifications"
            exit 0
          fi

          REPORT_DATE=$(date +%Y-%m-%d)
          TIMEFRAMES_ARRAY=$(echo $TIMEFRAMES | jq -r '.[]')

          # Send a Discord notification for each timeframe
          for TIMEFRAME in $TIMEFRAMES_ARRAY; do
            echo "Preparing Discord notification for crypto $TIMEFRAME..."
            REPORT_FILE="crypto_reports/$REPORT_DATE/$TIMEFRAME/harmonic_report_${REPORT_DATE}_$TIMEFRAME.txt"

            if [ ! -f "$REPORT_FILE" ]; then
              echo "⚠️ Report file not found for crypto $TIMEFRAME, skipping Discord notification"
              continue
            fi

            # Extract statistics
            TOTAL=$(grep "Total Stocks Scanned:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            BUY=$(grep "BUY Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            SELL=$(grep "SELL Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")

            # Build Discord message title/color
            if [ "$BUY" -gt 0 ] || [ "$SELL" -gt 0 ]; then
              COLOR="15844367"  # Gold/Orange for crypto
              TITLE="✅ 🪙 $TIMEFRAME Crypto Scan Complete - Signals Found!"
            else
              COLOR="10181046"  # Grey
              TITLE="📊 🪙 $TIMEFRAME Crypto Scan Complete"
            fi

            DESCRIPTION="**Timeframe:** $TIMEFRAME\\n**Total Scanned:** $TOTAL cryptocurrencies\\n\\n🟢 **BUY Signals:** $BUY\\n🔴 **SELL Signals:** $SELL"


            # Run Python script to parse crypto signals and create Discord payload
            REPORT_FILE="$REPORT_FILE" TITLE="$TITLE" DESCRIPTION="$DESCRIPTION" COLOR="$COLOR" TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
              python3 .github/scripts/parse_discord_signals.py > "discord_crypto_payload_$TIMEFRAME.json"

            # Send Discord notification
            curl -H "Content-Type: application/json" \
                 -d @"discord_crypto_payload_$TIMEFRAME.json" \
                 $DISCORD_WEBHOOK

            echo "✅ Discord notification sent for crypto $TIMEFRAME"
          done

      - name: Upload crypto reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-reports-all-timeframes-${{ github.run_number }}
          path: |
            crypto_reports/
          retention-days: 30

  # Summary job
  summary:
    needs: [stock-scans, crypto-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send completion summary
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            exit 0
          fi

          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"✅ All Sequential Scans Complete\",
                   \"description\": \"**Mode:** Sequential (rate-limit compliant)\\n**Timeframes:** ${{ needs.setup.outputs.timeframes }}\\n**Strategy:** ${{ needs.setup.outputs.tp_strategy }}\\n\\nStock Scans: ${{ needs.stock-scans.result }}\\nCrypto Scans: ${{ needs.crypto-scan.result }}\",
                   \"color\": 3066993,
                   \"footer\": {\"text\": \"View detailed results in artifacts\"},
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
                 }]
               }" \
               $DISCORD_WEBHOOK

