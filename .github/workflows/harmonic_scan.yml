# Build payload
title = os.environ.get('TITLE')
description = os.environ.get('DESCRIPTION')
color = int(os.environ.get('COLOR'))
timestamp = os.environ.get('TIMESTAMP')

payload = {
    "embeds": [{
        "title": title,
