name: Concurrent Multi-Timeframe Scan

on:
  # Scheduled run - 5 minutes after market close, runs BOTH daily and weekly concurrently
  schedule:
    - cron: '5 21 * * 1-5'  # Mon-Fri at 4:05 PM EST - scans both 1d and 1wk timeframes

  # Manual trigger with multiple timeframe selection
  workflow_dispatch:
    inputs:
      timeframes:
        description: 'Timeframes to scan (comma-separated: 1d,1wk,1mo)'
        required: true
        default: '1d,1wk'
        type: string
      tp_strategy:
        description: 'Take Profit Strategy'
        required: true
        default: 'MITCH'
        type: choice
        options:
          - 'SCOTT'
          - 'MITCH'
          - 'POSITION'
      include_crypto:
        description: 'Include crypto scan?'
        required: true
        default: false
        type: boolean
      max_stocks:
        description: 'Max stocks per timeframe (empty = all)'
        required: false
        type: string

jobs:
  # Parse the timeframes input into a matrix
  setup:
    runs-on: ubuntu-latest
    outputs:
      timeframes: ${{ steps.parse.outputs.timeframes }}
      tp_strategy: ${{ steps.parse.outputs.tp_strategy }}
      include_crypto: ${{ steps.parse.outputs.include_crypto }}
      max_stocks: ${{ steps.parse.outputs.max_stocks }}
    steps:
      - name: Parse timeframes
        id: parse
        run: |
          # Determine configuration based on trigger type
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Scheduled run - run BOTH daily and weekly timeframes concurrently
            echo "timeframes=[\"1d\",\"1wk\"]" >> $GITHUB_OUTPUT
            echo "tp_strategy=MITCH" >> $GITHUB_OUTPUT
            echo "include_crypto=false" >> $GITHUB_OUTPUT
            echo "max_stocks=" >> $GITHUB_OUTPUT
            echo "📊 Scheduled: Concurrent Daily (1d) + Weekly (1wk) Scan - 5 min after market close"
          else
            # Manual trigger - use provided inputs
            TIMEFRAMES="${{ github.event.inputs.timeframes }}"
            JSON_ARRAY=$(echo $TIMEFRAMES | jq -R -c 'split(",")')
            echo "timeframes=$JSON_ARRAY" >> $GITHUB_OUTPUT
            echo "tp_strategy=${{ github.event.inputs.tp_strategy }}" >> $GITHUB_OUTPUT
            echo "include_crypto=${{ github.event.inputs.include_crypto }}" >> $GITHUB_OUTPUT
            echo "max_stocks=${{ github.event.inputs.max_stocks }}" >> $GITHUB_OUTPUT
            echo "🎯 Manual: Timeframes=$TIMEFRAMES, Strategy=${{ github.event.inputs.tp_strategy }}, Crypto=${{ github.event.inputs.include_crypto }}"
          fi

  # Run stock scans concurrently for each timeframe
  stock-scans:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 4  # Run up to 4 scans at once
      matrix:
        timeframe: ${{ fromJson(needs.setup.outputs.timeframes) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure scan for ${{ matrix.timeframe }}
        run: |
          sed -i "s/DATA_INTERVAL = '.*'/DATA_INTERVAL = '${{ matrix.timeframe }}'/" src/config/config.py
          sed -i "s/TP_STRATEGY = '.*'/TP_STRATEGY = '${{ needs.setup.outputs.tp_strategy }}'/" src/config/config.py

          if [ -n "${{ needs.setup.outputs.max_stocks }}" ]; then
            sed -i "s/MAX_STOCKS_TO_SCAN = .*/MAX_STOCKS_TO_SCAN = ${{ needs.setup.outputs.max_stocks }}/" src/config/config.py
          fi

          echo "⚙️ Configuration for ${{ matrix.timeframe }}:"
          grep "DATA_INTERVAL = " src/config/config.py
          grep "TP_STRATEGY = " src/config/config.py
          grep "MAX_STOCKS_TO_SCAN = " src/config/config.py

      - name: Run scan for ${{ matrix.timeframe }}
        run: |
          echo "🚀 Starting ${{ matrix.timeframe }} scan..."
          python src/harmonic_scanner.py

      - name: Extract trades
        if: success()
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          if [ -d "reports/$REPORT_DATE" ]; then
            python scripts/extract_trades.py --date $REPORT_DATE --timeframe ${{ matrix.timeframe }}
          fi

      - name: Prepare Discord summary
        id: summary
        if: always()
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          REPORT_FILE="reports/$REPORT_DATE/harmonic_report_${REPORT_DATE}.txt"

          if [ -f "$REPORT_FILE" ]; then
            # Extract statistics
            TOTAL=$(grep "Total Stocks Scanned:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            BUY=$(grep "BUY Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            SELL=$(grep "SELL Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")

            # Get top BUY tickers (first 5)
            BUY_TICKERS=$(grep -A 50 "^BUY SIGNALS" "$REPORT_FILE" | grep "^Ticker:" | head -5 | sed 's/Ticker: //' | tr '\n' ', ' | sed 's/, $//')

            # Get top SELL tickers (first 5)
            SELL_TICKERS=$(grep -A 50 "^SELL SIGNALS" "$REPORT_FILE" | grep "^Ticker:" | head -5 | sed 's/Ticker: //' | tr '\n' ', ' | sed 's/, $//')

            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "buy=$BUY" >> $GITHUB_OUTPUT
            echo "sell=$SELL" >> $GITHUB_OUTPUT
            echo "buy_tickers=$BUY_TICKERS" >> $GITHUB_OUTPUT
            echo "sell_tickers=$SELL_TICKERS" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send to Discord
        if: always() && steps.summary.outputs.status == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK not set - skipping Discord notification"
            exit 0
          fi

          # Build Discord message
          if [ "${{ steps.summary.outputs.buy }}" -gt 0 ] || [ "${{ steps.summary.outputs.sell }}" -gt 0 ]; then
            COLOR="3066993"  # Green
            TITLE="✅ ${{ matrix.timeframe }} Scan Complete - Signals Found!"
          else
            COLOR="10181046"  # Grey
            TITLE="📊 ${{ matrix.timeframe }} Scan Complete"
          fi

          DESCRIPTION="**Timeframe:** ${{ matrix.timeframe }}\n**Strategy:** ${{ needs.setup.outputs.tp_strategy }}\n**Total Scanned:** ${{ steps.summary.outputs.total }}"

          # Build fields
          FIELDS="["
          FIELDS="$FIELDS{\"name\":\"🟢 BUY Signals\",\"value\":\"${{ steps.summary.outputs.buy }}\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"🔴 SELL Signals\",\"value\":\"${{ steps.summary.outputs.sell }}\",\"inline\":true}"

          # Add ticker lists if available
          if [ -n "${{ steps.summary.outputs.buy_tickers }}" ]; then
            FIELDS="$FIELDS,{\"name\":\"Top BUY Tickers\",\"value\":\"${{ steps.summary.outputs.buy_tickers }}\"}"
          fi
          if [ -n "${{ steps.summary.outputs.sell_tickers }}" ]; then
            FIELDS="$FIELDS,{\"name\":\"Top SELL Tickers\",\"value\":\"${{ steps.summary.outputs.sell_tickers }}\"}"
          fi

          FIELDS="$FIELDS]"

          # Send to Discord
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"$TITLE\",
                   \"description\": \"$DESCRIPTION\",
                   \"color\": $COLOR,
                   \"fields\": $FIELDS,
                   \"footer\": {\"text\": \"Harmonic Pattern Scanner\"},
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
                 }]
               }" \
               $DISCORD_WEBHOOK

      - name: Upload reports for ${{ matrix.timeframe }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.timeframe }}-${{ github.run_number }}
          path: |
            reports/
            paper_trades.json
          retention-days: 30

  # Run crypto scan concurrently if requested
  crypto-scan:
    needs: setup
    if: needs.setup.outputs.include_crypto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        timeframe: ${{ fromJson(needs.setup.outputs.timeframes) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure crypto scan for ${{ matrix.timeframe }}
        run: |
          sed -i "s/DATA_INTERVAL = '.*'/DATA_INTERVAL = '${{ matrix.timeframe }}'/" src/config/config.py
          echo "⚙️ Crypto configuration for ${{ matrix.timeframe }}:"
          grep "DATA_INTERVAL = " src/config/config.py

      - name: Run crypto scan for ${{ matrix.timeframe }}
        run: |
          echo "🚀 Starting ${{ matrix.timeframe }} crypto scan..."
          python scripts/scan_crypto.py

      - name: Extract crypto trades
        if: success()
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          if [ -d "crypto_reports/$REPORT_DATE" ]; then
            python scripts/extract_crypto_trades.py --date $REPORT_DATE --timeframe ${{ matrix.timeframe }} || true
          fi

      - name: Prepare crypto Discord summary
        id: crypto_summary
        if: always()
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          REPORT_FILE="crypto_reports/$REPORT_DATE/harmonic_report_${REPORT_DATE}.txt"

          if [ -f "$REPORT_FILE" ]; then
            TOTAL=$(grep "Total Stocks Scanned:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            BUY=$(grep "BUY Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")
            SELL=$(grep "SELL Signals:" "$REPORT_FILE" | grep -o '[0-9]*' || echo "0")

            BUY_TICKERS=$(grep -A 50 "^BUY SIGNALS" "$REPORT_FILE" | grep "^Ticker:" | head -5 | sed 's/Ticker: //' | tr '\n' ', ' | sed 's/, $//')
            SELL_TICKERS=$(grep -A 50 "^SELL SIGNALS" "$REPORT_FILE" | grep "^Ticker:" | head -5 | sed 's/Ticker: //' | tr '\n' ', ' | sed 's/, $//')

            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "buy=$BUY" >> $GITHUB_OUTPUT
            echo "sell=$SELL" >> $GITHUB_OUTPUT
            echo "buy_tickers=$BUY_TICKERS" >> $GITHUB_OUTPUT
            echo "sell_tickers=$SELL_TICKERS" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send crypto results to Discord
        if: always() && steps.crypto_summary.outputs.status == 'success'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK not set - skipping Discord notification"
            exit 0
          fi

          if [ "${{ steps.crypto_summary.outputs.buy }}" -gt 0 ] || [ "${{ steps.crypto_summary.outputs.sell }}" -gt 0 ]; then
            COLOR="15844367"  # Gold/Orange for crypto
            TITLE="✅ 🪙 ${{ matrix.timeframe }} Crypto Scan Complete - Signals Found!"
          else
            COLOR="10181046"  # Grey
            TITLE="📊 🪙 ${{ matrix.timeframe }} Crypto Scan Complete"
          fi

          DESCRIPTION="**Timeframe:** ${{ matrix.timeframe }}\n**Total Scanned:** ${{ steps.crypto_summary.outputs.total }} cryptocurrencies"

          FIELDS="["
          FIELDS="$FIELDS{\"name\":\"🟢 BUY Signals\",\"value\":\"${{ steps.crypto_summary.outputs.buy }}\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"🔴 SELL Signals\",\"value\":\"${{ steps.crypto_summary.outputs.sell }}\",\"inline\":true}"

          if [ -n "${{ steps.crypto_summary.outputs.buy_tickers }}" ]; then
            FIELDS="$FIELDS,{\"name\":\"Top BUY Cryptos\",\"value\":\"${{ steps.crypto_summary.outputs.buy_tickers }}\"}"
          fi
          if [ -n "${{ steps.crypto_summary.outputs.sell_tickers }}" ]; then
            FIELDS="$FIELDS,{\"name\":\"Top SELL Cryptos\",\"value\":\"${{ steps.crypto_summary.outputs.sell_tickers }}\"}"
          fi

          FIELDS="$FIELDS]"

          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"$TITLE\",
                   \"description\": \"$DESCRIPTION\",
                   \"color\": $COLOR,
                   \"fields\": $FIELDS,
                   \"footer\": {\"text\": \"Harmonic Pattern Scanner\"},
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
                 }]
               }" \
               $DISCORD_WEBHOOK

      - name: Upload crypto reports for ${{ matrix.timeframe }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-reports-${{ matrix.timeframe }}-${{ github.run_number }}
          path: |
            crypto_reports/
          retention-days: 30

  # Summary job that runs after all scans complete
  summary:
    needs: [stock-scans, crypto-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send completion summary to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "⚠️ DISCORD_WEBHOOK not set - skipping summary"
            exit 0
          fi

          # Determine overall status
          STOCK_STATUS="${{ needs.stock-scans.result }}"
          CRYPTO_STATUS="${{ needs.crypto-scan.result }}"

          if [[ "$STOCK_STATUS" == "success" ]] && ([[ "$CRYPTO_STATUS" == "success" ]] || [[ "$CRYPTO_STATUS" == "skipped" ]]); then
            COLOR="3066993"  # Green
            TITLE="✅ All Scans Completed Successfully"
          else
            COLOR="15158332"  # Red
            TITLE="⚠️ Some Scans Failed"
          fi

          # Build description based on trigger type
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            DESCRIPTION="**Scheduled Scan**\n"
          else
            DESCRIPTION="**Manual Scan**\n"
          fi
          DESCRIPTION="${DESCRIPTION}**Timeframes:** ${{ needs.setup.outputs.timeframes }}\n**Strategy:** ${{ needs.setup.outputs.tp_strategy }}\n\n"
          DESCRIPTION="${DESCRIPTION}Stock Scans: $STOCK_STATUS\n"
          DESCRIPTION="${DESCRIPTION}Crypto Scans: $CRYPTO_STATUS"

          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"$TITLE\",
                   \"description\": \"$DESCRIPTION\",
                   \"color\": $COLOR,
                   \"footer\": {\"text\": \"View detailed results in GitHub Actions artifacts\"},
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
                 }]
               }" \
               $DISCORD_WEBHOOK
